<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A digital and STEM lab with code windows, circuit traces and a small robot">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c1a"/>
      <stop offset="0.5" stop-color="#152045"/>
      <stop offset="1" stop-color="#3a2450"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.75" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1c1233"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg3)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>

  <!-- circuit traces -->
  <g stroke="#ff9a3c" stroke-width="2.5" fill="none" opacity="0.28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1920 210h-190l-60 60h-150l-70 70H1290"/>
    <path d="M1920 430h-300l-80 80h-190"/>
    <path d="M1920 720h-240l-90-90h-210l-70 70h-140"/>
    <path d="M1160 940h180l80-80h240l70 70h190"/>
    <path d="M1010 140v120l70 70v140"/>
  </g>
  <g fill="#ffd166" opacity="0.7">
    <circle cx="1290" cy="340" r="8"/><circle cx="1350" cy="510" r="8"/>
    <circle cx="1250" cy="700" r="8"/><circle cx="1160" cy="940" r="8"/>
    <circle cx="1080" cy="470" r="8"/><circle cx="1670" cy="720" r="8"/>
  </g>

  <!-- code window -->
  <g transform="translate(1240 292)">
    <rect x="18" y="22" width="620" height="392" rx="20" fill="#08090c" opacity="0.5"/>
    <rect width="620" height="392" rx="20" fill="url(#screen)" stroke="#ff9a3c" stroke-opacity="0.35" stroke-width="2"/>
    <rect width="620" height="52" rx="20" fill="#ffffff" opacity="0.06"/>
    <rect y="34" width="620" height="18" fill="#ffffff" opacity="0.06"/>
    <g><circle cx="34" cy="26" r="8" fill="#ff5a1f"/><circle cx="62" cy="26" r="8" fill="#ffd166"/><circle cx="90" cy="26" r="8" fill="#7fd4a0"/></g>
    <g stroke-linecap="round" stroke-width="10">
      <path d="M46 110h96" stroke="#ff9a3c" opacity="0.95"/>
      <path d="M160 110h172" stroke="#ffffff" opacity="0.35"/>
      <path d="M72 158h120" stroke="#ffd166" opacity="0.8"/>
      <path d="M210 158h210" stroke="#ffffff" opacity="0.25"/>
      <path d="M72 206h240" stroke="#ffffff" opacity="0.3"/>
      <path d="M98 254h140" stroke="#ff5a1f" opacity="0.85"/>
      <path d="M256 254h180" stroke="#ffffff" opacity="0.22"/>
      <path d="M46 302h150" stroke="#ffffff" opacity="0.3"/>
      <path d="M46 350h84" stroke="#ff9a3c" opacity="0.7"/>
    </g>
  </g>

  <!-- friendly robot -->
  <g transform="translate(1560 700)">
    <path d="M0-118v-46" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-176" r="14" fill="#ff5a1f"/>
    <rect x="-96" y="-118" width="192" height="150" rx="34" fill="#1a1f3a" stroke="#ff9a3c" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="-38" cy="-52" r="18" fill="#ffd166"/>
    <circle cx="38" cy="-52" r="18" fill="#ffd166"/>
    <path d="M-32 -2q32 30 64 0" stroke="#ff9a3c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="-74" y="46" width="148" height="118" rx="24" fill="#241c3f" stroke="#ff9a3c" stroke-opacity="0.35" stroke-width="3"/>
    <rect x="-40" y="80" width="80" height="16" rx="8" fill="#ff5a1f" opacity="0.85"/>
    <rect x="-40" y="110" width="52" height="12" rx="6" fill="#ffd166" opacity="0.6"/>
    <rect x="-118" y="56" width="34" height="86" rx="17" fill="#1a1f3a"/>
    <rect x="84" y="56" width="34" height="86" rx="17" fill="#1a1f3a"/>
    <ellipse cx="0" cy="180" rx="130" ry="20" fill="#08090c" opacity="0.45"/>
  </g>

  <!-- desk line and floating particles -->
  <path d="M1180 872h700" stroke="#ffffff" stroke-width="3" opacity="0.12"/>
  <g fill="#ffd166" opacity="0.5">
    <circle cx="1010" cy="180" r="4"/><circle cx="1740" cy="300" r="5"/>
    <circle cx="1450" cy="120" r="4"/><circle cx="1820" cy="560" r="4"/>
    <circle cx="1120" cy="820" r="5"/><circle cx="1360" cy="1000" r="4"/>
  </g>

  <rect width="1920" height="1080" fill="#0f1115" opacity="0.1"/>
</svg>
